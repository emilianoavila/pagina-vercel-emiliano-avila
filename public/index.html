<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mando Abierto · Reseñas de videojuegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF6; --ink:#16163A; --muted:#5B5D80; --panel:#FFFFFF;
  --accent:#3D4DF5; --accent-ink:#FFFFFF; --star:#F5A400; --line:#D5D8E8; --err:#C4243B;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10112A;--ink:#EDEEFA;--muted:#A3A6CC;--panel:#1A1B3D;--accent:#7C89FF;--accent-ink:#10112A;--line:#2F3163;--err:#FF7A8E}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.1;margin:0}
header{padding:48px 24px 8px;max-width:1120px;margin:0 auto}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;letter-spacing:-.02em}
header p{color:var(--muted);max-width:52ch;margin:12px 0 0}
main{max-width:1120px;margin:0 auto;padding:24px;display:grid;gap:32px;grid-template-columns:minmax(0,340px) minmax(0,1fr);align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
form{background:var(--panel);border:2px solid var(--ink);border-radius:20px;padding:20px;position:sticky;top:16px;display:grid;gap:14px;box-shadow:6px 6px 0 var(--accent)}
@media(max-width:820px){form{position:static}}
form h2{font-size:1.4rem}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.stars input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.stars{display:flex;gap:2px;border:0;padding:0;margin:0}
.stars legend{font-weight:600;font-size:.95rem;margin-bottom:6px;padding:0}
.stars label{display:block;cursor:pointer}
.stars input{position:absolute;opacity:0;pointer-events:none}
.stars span{font-size:1.9rem;line-height:1;color:var(--line)}
.stars label.on span{color:var(--star)}
.file{font-weight:400;color:var(--muted)}
.file input{font:inherit;font-size:.9rem}
#preview{display:none;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1.5px solid var(--line)}
button.send{font:700 1rem 'Bricolage Grotesque',sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
button.send:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.2em;margin:0;font-size:.9rem;color:var(--err)}
#msg.ok{color:var(--muted)}
.feed-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.feed-head h2{font-size:1.6rem}
.feed-head span{color:var(--muted);font-size:.9rem}
#feed{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
article{background:var(--panel);border-radius:16px;overflow:hidden;border:1.5px solid var(--line);display:flex;flex-direction:column}
article img,.noimg{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line)}
.noimg{display:grid;place-items:center;font:800 2.2rem 'Bricolage Grotesque',sans-serif;color:var(--muted)}
.body{padding:14px 16px 16px;display:grid;gap:8px}
article h3{font-size:1.25rem}
.rate{color:var(--star);letter-spacing:2px}
article p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.by{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);grid-column:1/-1;padding:40px 0}
@media(prefers-reduced-motion:no-preference){article{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
</head>
<body>
<header>
  <h1>Mando Abierto</h1>
  <p>Cuenta qué jugaste, qué te pareció y súbele una miniatura. Lee lo que opina el resto.</p>
</header>
<main>
  <form id="form" novalidate>
    <h2>Escribe tu reseña</h2>
    <label>Nombre del juego
      <input type="text" name="game" maxlength="80" required placeholder="Ej: Hollow Knight">
    </label>
    <label>Tu nombre (opcional)
      <input type="text" name="author" maxlength="40" placeholder="Anónimo">
    </label>
    <fieldset class="stars" id="stars">
      <legend>Puntuación</legend>
    </fieldset>
    <label>Tu reseña
      <textarea name="text" maxlength="2000" required placeholder="¿Qué te gustó? ¿Qué no?"></textarea>
    </label>
    <label class="file">Miniatura (JPG, PNG o WebP)
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
    </label>
    <img id="preview" alt="Vista previa de la miniatura">
    <button class="send" type="submit">Publicar reseña</button>
    <p id="msg" role="status"></p>
  </form>

  <section aria-labelledby="feedtitle">
    <div class="feed-head"><h2 id="feedtitle">Últimas reseñas</h2><span id="count"></span></div>
    <div id="feed"><p class="empty">Cargando reseñas…</p></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const form = $('#form'), feed = $('#feed'), msg = $('#msg'), fileInput = $('#file'), preview = $('#preview');
let rating = 0, thumb = null;

// Estrellas accesibles (radios)
const starsBox = $('#stars');
for (let i = 1; i <= 5; i++) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="radio" name="rating" value="${i}" aria-label="${i} de 5"><span aria-hidden="true">★</span>`;
  starsBox.append(l);
}
starsBox.addEventListener('change', e => {
  rating = +e.target.value;
  [...starsBox.querySelectorAll('label')].forEach((l, i) => l.classList.toggle('on', i < rating));
});

// Redimensiona la miniatura en el navegador (máx. 640px) antes de subirla
function resize(file, max = 640) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Imagen no válida')), 'image/jpeg', 0.82);
    };
    img.onerror = () => reject(new Error('No se pudo leer la imagen'));
    img.src = URL.createObjectURL(file);
  });
}

fileInput.addEventListener('change', async () => {
  thumb = null; preview.style.display = 'none';
  const f = fileInput.files[0];
  if (!f) return;
  try {
    thumb = await resize(f);
    preview.src = URL.createObjectURL(thumb);
    preview.style.display = 'block';
  } catch (e) { say(e.message, true); fileInput.value = ''; }
});

function say(t, err) { msg.textContent = t; msg.className = err ? '' : 'ok'; }

function card(r) {
  const a = document.createElement('article');
  let media;
  if (r.image) { media = document.createElement('img'); media.src = r.image; media.alt = `Miniatura de ${r.game}`; media.loading = 'lazy'; }
  else { media = document.createElement('div'); media.className = 'noimg'; media.textContent = r.game.slice(0, 2).toUpperCase(); }
  const body = document.createElement('div'); body.className = 'body';
  const h = document.createElement('h3'); h.textContent = r.game;
  const s = document.createElement('div'); s.className = 'rate';
  s.textContent = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
  s.setAttribute('aria-label', `${r.rating} de 5`);
  const p = document.createElement('p'); p.textContent = r.text;
  const by = document.createElement('div'); by.className = 'by';
  by.textContent = `${r.author} · ${new Date(r.createdAt).toLocaleDateString('es')}`;
  body.append(h, s, p, by); a.append(media, body);
  return a;
}

async function load() {
  try {
    const res = await fetch('/api/reviews');
    if (!res.ok) throw 0;
    const list = await res.json();
    feed.replaceChildren(...(list.length ? list.map(card) : [Object.assign(document.createElement('p'), { className: 'empty', textContent: 'Aún no hay reseñas. Publica la primera.' })]));
    $('#count').textContent = list.length ? `${list.length} reseña${list.length > 1 ? 's' : ''}` : '';
  } catch { feed.innerHTML = '<p class="empty">No se pudieron cargar las reseñas. Recarga la página.</p>'; }
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(form);
  const game = fd.get('game').trim(), text = fd.get('text').trim();
  if (!game) return say('Escribe el nombre del juego.', true);
  if (!rating) return say('Elige una puntuación de 1 a 5 estrellas.', true);
  if (!text) return say('Escribe tu reseña.', true);

  const btn = form.querySelector('.send'); btn.disabled = true; say('Publicando…');
  try {
    let image = '';
    if (thumb) {
      const up = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: thumb });
      if (!up.ok) throw new Error((await up.json()).error || 'No se pudo subir la miniatura.');
      image = (await up.json()).url;
    }
    const res = await fetch('/api/reviews', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ game, author: fd.get('author'), rating, text, image })
    });
    if (!res.ok) throw new Error((await res.json()).error || 'No se pudo publicar.');
    form.reset(); rating = 0; thumb = null; preview.style.display = 'none';
    starsBox.querySelectorAll('label').forEach(l => l.classList.remove('on'));
    say('Reseña publicada.');
    load();
  } catch (err) { say(err.message, true); }
  btn.disabled = false;
});

load();
</script>
</body>
</html>
